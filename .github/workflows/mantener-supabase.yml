# Llama cada 3 días a la función de recomendaciones (?ping=1, sin coste de IA)
# para que el proyecto gratuito de Supabase no se pause por inactividad.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" \
            "https://imubjvuoecziuzloylra.supabase.co/functions/v1/recomendaciones?ping=1" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "apikey: $SUPABASE_ANON_KEY")
          cat /tmp/r.txt; echo; echo "HTTP $code"
          test "$code" = "200"
